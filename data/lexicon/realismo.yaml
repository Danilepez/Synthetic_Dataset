# 11. Nombres únicos: sin plural, sin numeral y sin adjetivo ("los nortes", "el norte pequeño").
nombres_unicos: [norte, sur, mundo, planeta, universo, cielo]

# 12. Abstractos contables: los únicos abstractos que admiten plural o numeral. Los demás van en
