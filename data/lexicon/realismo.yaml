ser_demostrativo_abstracto: ["@evento", "@mal", "@logro", "@documento", "@dinero"]

# 8. Adjetivos que modifican a un abstracto, según el conjunto del nombre. Un abstracto que no está
#    en ninguno de estos conjuntos no lleva adjetivo.
adjetivos_abstracto:
  dicho: [importante, verdadero, falso, siguiente, breve, largo, corto, sencillo,
          extraño, raro, bueno, malo, especial, urgente, personal, difícil, fácil, nuevo]
  documento: [importante, verdadero, falso, siguiente, breve, largo, corto, oficial,
              público, nuevo, digital, legal]
  evento: [importante, largo, corto, breve, siguiente, especial, tradicional,
           comunitario, familiar, cultural, nacional, internacional, local, público, oficial, difícil,
           fácil, pacífico, violento, nuevo]
  valor: [importante, necesario, verdadero, colectivo, individual, humano, social, cultural, público,
          legal]
  obra: [nuevo, importante, comunitario, educativo, productivo, social, económico, cultural, digital,
         local, nacional, municipal, necesario, útil, difícil, sencillo, complicado]
  sentimiento: [extraño, verdadero, raro]
  disciplina: [importante, difícil, fácil, nuevo, tradicional, ancestral, útil, verdadero, sencillo,
               complicado, cultural]
  dinero: [necesario, justo, injusto, importante]
  mal: [grave, urgente, importante, difícil, complicado, violento, económico, social, político,
        extraño, verdadero, nuevo]
  logro: [importante, verdadero, especial]

# 9. "a" personal: con estos verbos, un objeto directo animal lleva "a" en español
#    ("Cuido al perro", no "Cuido el perro"). Solo cambia el español.
a_personal_animal: [seguir, ayudar, llamar, atender, invitar, nombrar, despertar, acompañar, guiar,
