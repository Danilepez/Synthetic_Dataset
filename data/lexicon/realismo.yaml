# Capa de realismo del léxico de producción (regla R23, rama dev/Camilo).
#
# Para qué sirve. Las clases de CH-406 son gruesas: "abstracto" reúne 776 nombres y "objeto"
# mezcla un libro con la lluvia. Con solo las clases salen oraciones gramaticales pero absurdas
# ("Dirán cuatro desarrollos", "Compré la lluvia", "Escribiremos esa muñeca"). Este archivo
# afina, palabra por palabra, qué combinaciones se generan. No cambia ninguna raíz (CH-309):
# solo decide qué ideas son válidas.
#
# Cómo se lee.
# - Todas las palabras se escriben como en la columna es_m de lexico_sin_raices.csv.
# - "@nombre" se refiere a un conjunto de la sección `conjuntos`.
# - El notebook (sección 7.2) resuelve los nombres y se detiene si alguno no existe.
# - Una regla que no aparece aquí no restringe nada: manda la clase de CH-406.

version: 1

