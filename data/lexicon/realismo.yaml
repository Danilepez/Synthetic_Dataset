# 3. Nombres concretos por verbo y función. {verbo: {función: {clase: [nombres]}}}.
#    Funciones: od (objeto directo) y suj (sujeto). Si una clase aparece, solo valen esos nombres
#    de esa clase; las demás clases del verbo no cambian. Una lista vacía prohíbe la clase.
